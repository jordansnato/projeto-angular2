<form (submit)="cadastrarProduto($event)">

    <!-- Titulo -->
    <input type="text" [formField]="interfaceForm.title">

    <!-- Descrição -->
     <input type="text" [formField]="interfaceForm.descricao">

     <!-- Preço -->
      <input type="text" [formField]="interfaceForm.preco">

      <button>Cadastrar produto</button>
</form>
    
    <button (click)="mostrarProduto()">Mostrar Lista</button> 
    @if(mostrarArray()){
        @for (item of itens(); track item.title) {
            <p>{{item.title}}</p>
        }
    }
