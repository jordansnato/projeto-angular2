<form (submit)="cadastro()">
    <input type="text" [formField]="loginForm.nome" placeholder="Nome completo">
    <input type="text" [formField]="loginForm.email" placeholder="Email">
    <input type="text" [formField]="loginForm.senha" placeholder="Senha">
    <input type="text"  [formField]="loginForm.confirmeSenha" placeholder="confirme a senha">
    <input type="text" [formField]="loginForm.nascimento" placeholder="Data nascimento 00/00/00">

    <button>cadastrar</button>
</form>
